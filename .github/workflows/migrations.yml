name: Run Database Migrations

# Manual-only trigger. The automatic push trigger was removed because this
# workflow requires GitHub secrets (SUPABASE_ACCESS_TOKEN, SUPABASE_DB_PASSWORD)
# that were never configured, and because migrations have already been applied
# directly via the Supabase SQL editor (re-running them fails on existing
# objects). To re-enable auto-migrations: add the secrets in repo Settings >
# Secrets and variables > Actions, repair migration history with
# `supabase migration repair`, then restore the push trigger below.
on:
  workflow_dispatch:

jobs:
  migrate:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'
          cache: 'npm'

      - name: Install Supabase CLI
        run: npm install -g supabase

      - name: Run Migrations
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: |
          supabase db push --db-url postgresql://postgres:${{ secrets.SUPABASE_DB_PASSWORD }}@db.tgskrunjdmoyjgrieuzg.supabase.co:5432/postgres

      - name: Verify Migration
        run: |
          echo "✅ Migrations completed successfully"
